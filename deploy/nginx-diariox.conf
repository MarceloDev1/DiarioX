# /etc/nginx/sites-available/diariox
# After editing: sudo ln -s /etc/nginx/sites-available/diariox /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
# Issue TLS certificate with: sudo certbot --nginx -d diariox.example.com

server {
    listen 80;
    listen [::]:80;
    server_name diariox.example.com;

    # Let certbot handle the redirect to HTTPS after issuing the cert.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diariox.example.com;

    # Managed by certbot:
    # ssl_certificate     /etc/letsencrypt/live/diariox.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/diariox.example.com/privkey.pem;

    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
